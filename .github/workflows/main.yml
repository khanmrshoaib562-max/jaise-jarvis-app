name: Build Jarvis APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract Jarvis.zip
        run: |
          echo "Extracting Jarvis.zip..."
          unzip -o Jarvis.zip -d project
          echo "=== Extracted structure ==="
          find project -maxdepth 3 -type d
          find project -name "build.gradle*" -o -name "settings.gradle*" -o -name "gradlew" | head -20

      - name: Find project root and build
        run: |
          # Project root ढूंढो जहाँ build.gradle या settings.gradle हो
          PROJECT_ROOT=$(find project -name "settings.gradle*" -o -name "build.gradle" | head -1 | xargs dirname)
          
          if [ -z "$PROJECT_ROOT" ]; then
            echo "Error: No Android project found inside ZIP"
            ls -la project/
            exit 1
          fi
          
          echo "Project root found at: $PROJECT_ROOT"
          cd "$PROJECT_ROOT"
          
          # अगर gradlew नहीं है तो wrapper बनाओ
          if [ ! -f "./gradlew" ]; then
            echo "gradlew not found, generating wrapper..."
            gradle wrapper --gradle-version 8.7 || true
          fi
          
          chmod +x ./gradlew || true
          
          echo "Building APK..."
          ./gradlew assembleDebug --stacktrace || gradle assembleDebug --stacktrace

      - name: Upload APK
  
