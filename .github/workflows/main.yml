name: Build Jarvis APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: platform-tools

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Extract and Build
        run: |
          unzip -o JarvisApp.zip -d project
          find project -maxdepth 4 -type d -name "settings.gradle*" -o -name "build.gradle*"
          PROJECT_ROOT=$(find project -name "settings.gradle*" -o -name "build.gradle*" | head -1 | xargs dirname)
          echo "Root: $PROJECT_ROOT"
          cd "$PROJECT_ROOT"
          if [ ! -f gradlew ]; then
            sudo apt-get update && sudo apt-get install -y gradle
            gradle wrapper --gradle-version 8.7
          fi
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: Jarvis-APK
          path: "**/*.apk"
          if-no-files-found: warn
